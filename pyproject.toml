[project]
name = "loma"
version = "1.0.0"
description = "A very good local feature matcher."
readme = "README.md"
authors = [
    { name = "Johan Edstedt", email = "johan.edstedt@liu.se" },
    { name = "David Nordström", email = "davnords@chalmers.se" }
]
requires-python = ">=3.10"
dependencies = [
    "dataclasses>=0.8",
    "einops>=0.8.1",
    "opencv-python>=4.12.0.88",
    "pillow>=12.0.0",
    "torch",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "tyro",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project.optional-dependencies]
eval = [
    "wxbs-benchmark>=0.0.4",
    "scipy>=1.15.3",
]
dev = [
    "ruff",
    "pyright",
]